services:
  redis-tg:
    image: redis:8.2-alpine
    container_name: redis-tg-container
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - tg-network

  postgres-tg:
    image: postgres:14-alpine
    container_name: postgres-tg-container
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-test}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-test}
      - POSTGRES_DB=${DB_NAME:-tg_bot}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-test} -d ${DB_NAME:-tg_bot}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tg-network

  bot:
    build: .
    container_name: tg-bot-container
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=postgres-tg
      - REDIS_HOST=redis-tg
    depends_on:
      postgres-tg:
        condition: service_healthy
      redis-tg:
        condition: service_healthy
    volumes:
      - downloads:/root/downloads
    networks:
      - tg-network

volumes:
  postgres_data:
  redis_data:
  downloads:

networks:
  tg-network:
    driver: bridge